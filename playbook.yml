- hosts: all
  gather_facts: true
  become: true

  # pre_tasks est garanti s'exécuter AVANT les rôles
  pre_tasks:
    - name: Copy .env file from TP01 to the remote server
      copy:
        src: ./TP01/.env
        dest: /opt/.env
        mode: '0600'

  roles:
    - docker
    - network
    - database
    - app
    - front
    - proxy
    - role: grafana.grafana.grafana
      vars:
        grafana_security:
          admin_user: admin
          admin_password: admin