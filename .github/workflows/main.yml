name: CI devops 2025
on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  # 1. ÉTAPE D'EXÉCUTION DES TESTS BACKEND
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Backend Tests
        run: mvn -B clean verify --file TP01/backend/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/

  # 2. ÉTAPE D'ANALYSE SONAR
  sonar-analysis:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/
      - name: Run SonarCloud Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=MaximeMorotti_Devops -Dsonar.organization=maximemorotti -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }} --file TP01/backend/pom.xml

# 3. ÉTAPES CD : BUILD & PUSH
  build-and-push-backend:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 👈 Sécurise le build backend
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./TP01/backend 
          push: true
          no-cache: true
          cache-from: ""
          cache-to: ""
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:${{ github.sha }}

  build-and-push-database:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 👈 Sécurise le build database
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./TP01/database 
          push: true
          no-cache: true
          cache-from: ""
          cache-to: ""
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-database:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-database:${{ github.sha }}

  build-and-push-httpd:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 👈 Déjà OK
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./TP01/httpd    
          push: true
          no-cache: true
          cache-from: ""
          cache-to: ""
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-httpd:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-httpd:${{ github.sha }}

  build-and-push-front:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 👈 Déjà OK
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./TP01/httpd/devops-front-main
          push: true
          no-cache: true
          cache-from: ""
          cache-to: ""
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-front:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-front:${{ github.sha }}

  # 4. ÉTAPE DE DÉPLOIEMENT
  deploy:
    needs: [build-and-push-backend, build-and-push-database, build-and-push-httpd, build-and-push-front]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create .env file dynamically
        run: |
          mkdir -p TP01
          echo "${{ secrets.ENV_FILE_CONTENT }}" > TP01/.env
          chmod 600 TP01/.env
          
      - name: Run Ansible Playbook
        run: |
          pip install ansible
          ansible-galaxy install -r requirements.yml
          ansible-playbook -i inventories/setup.yml playbook.yml