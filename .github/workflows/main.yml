name: CI devops 2025
on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  # -------------------------------------------------------------
  # 1. ÉTAPE D'EXÉCUTION DES TESTS BACKEND (Tourne sur main ET develop)
  # -------------------------------------------------------------
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Backend Tests
        run: mvn -B clean verify --file TP01/backend/pom.xml

      - name: Share test reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/

  # -------------------------------------------------------------
  # 2. ÉTAPE D'ANALYSE SONAR (Tourne sur main ET develop)
  # -------------------------------------------------------------
  sonar-analysis:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/

      - name: Run SonarCloud Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn sonar:sonar 
          -Dsonar.projectKey=MaximeMorotti_Devops
          -Dsonar.organization=maximemorotti 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          --file TP01/backend/pom.xml

  # -------------------------------------------------------------
  # 3. ÉTAPES CD : BUILD & PUSH VERSIONNÉS
  # -------------------------------------------------------------
  build-and-push-backend:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/backend 
          push: true
          # Le symbole "|" permet de lister plusieurs tags à la suite
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:${{ github.sha }}

  build-and-push-database:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Database
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/database 
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-database:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-database:${{ github.sha }}

  build-and-push-httpd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push HTTPD
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/httpd    
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-httpd:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-httpd:${{ github.sha }}