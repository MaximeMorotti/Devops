name: CI devops 2025
on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  # -------------------------------------------------------------
  # MISSION 1 : CI & ANALYSE QUALITY (S'exécute en premier)
  # -------------------------------------------------------------
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze with Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B verify sonar:sonar 
          -Dsonar.projectKey=MaximeMorotti_Devops
          -Dsonar.organization=maximemorotti 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          --file TP01/backend/pom.xml

  # -------------------------------------------------------------
  # MISSION 2 : CD - BUILD & PUSH EN PARALLÈLE
  # -------------------------------------------------------------

  build-and-push-backend:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/backend 
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest
          push: ${{ github.ref == 'refs/heads/main' }}

  build-and-push-database:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Database
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/database 
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

  build-and-push-httpd:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push HTTPD
        uses: docker/build-push-action@v6
        with:
          context: ./TP01/httpd    
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/my-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}