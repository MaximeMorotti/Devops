name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  # 1. ÉTAPE D'EXÉCUTION DES TESTS
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Backend Tests
        run: mvn -B clean verify --file TP01/backend/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/

  # 2. ÉTAPE D'ANALYSE SONAR
  sonar-analysis:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: backend-target-dir
          path: TP01/backend/target/
      - name: Run SonarCloud Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn sonar:sonar 
          -Dsonar.projectKey=MaximeMorotti_Devops
          -Dsonar.organization=maximemorotti 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          --file TP01/backend/pom.xml

  # 3. ÉTAPES CD : BUILD & PUSH
  build-and-push:
    needs: sonar-analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, database, httpd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./TP01/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-${{ matrix.service }}:${{ github.sha }}

  # 4. ÉTAPE DE DÉPLOIEMENT (Manual Approval)
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production # <--- C'est ici que tu configures la validation manuelle
    steps:
      - uses: actions/checkout@v4
      - name: Run Ansible Playbook
        run: |
          # Installation d'Ansible et exécution
          pip install ansible
          ansible-playbook -i inventories/setup.yml playbook.yml \
          -e "ansible_ssh_private_key_file=./id_rsa" # Assure-toi d'avoir ta clé SSH en secret