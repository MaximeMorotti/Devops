name: CI devops 2025
on:
  push:
    branches: ["main", "develop"] # Déclenchement sur ces branches
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      # 1. On récupère le code de ton dépôt
      - uses: actions/checkout@v4

      # 2. On installe le JDK 21 (Temurin est une distribution standard très utilisée)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. On lance la compilation et les tests avec Maven
      - name: Build and test with Maven
        run: mvn clean verify --file TP01/backend/pom.xml